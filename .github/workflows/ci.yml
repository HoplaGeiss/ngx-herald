name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm exec ng build ngx-herald

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-ngx-herald
          path: dist/ngx-herald
          retention-days: 1

      - name: Build demo
        run: pnpm exec ng build demo
